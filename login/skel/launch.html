<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="content-type" content="text/html;charset=utf-8" />
    <script type="text/javascript" charset="utf-8" src="js/sConnectSimple.js"></script>
    <script type="text/javascript" charset="utf-8" src="js/jquery-min.js"></script>

    <title>Continue</title>

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f5f6f7;
            color: #333;
            text-align: center;
        }

        .card {
            max-width: 420px;
            margin: 50px auto;
            padding: 30px 25px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.10);
        }

        h2 {
            margin: 0 0 15px;
            font-size: 22px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        .btn {
            display: block;
            margin-top: 25px;
            padding: 15px 20px;
            background: #29495b;
            color: #fff;
            text-decoration: none;
            border-radius: 7px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div hidden class="card" id="cpDivAndroid">

    <h2>Continue in your browser</h2>

    <p>
        To continue, please open this page in your normal web browser.
    </p>

    <a class="btn" id="openBtn">Open in Browser</a>

<script>
document.getElementById('openBtn').addEventListener('click', function(e){
    e.preventDefault();

    // This is your current page WITH Coova's query string
    // e.g. https://cloud.radiusdesk.com/login/skel/target.html?res=notyet&uamip=10.1.0.1&uamport=3990&challenge=abc...
    var currentUrl = window.location.href;

    // Convert https://xxx to intent://xxx#Intent;scheme=https...
    var intentUrl = "intent://" + currentUrl.replace(/^https?:\/\//, '') +
        "#Intent;scheme=https;" +
        "action=android.intent.action.VIEW;" +
        "category=android.intent.category.BROWSABLE;" +
        "end";

    window.location.href = intentUrl;
});


$(document).ready(function(){
    console.log("Document is ready!");   
    var connect = sConnectSimple({});
    connect.init();            
});


</script>

</div>

<div hidden id="cpDivMain">

    <div hidden>
        <label><b>Username</b></label>
        <input type="text" placeholder="Enter Username" name="username" id='txtUsername' required>

        <label><b>Password</b></label>
        <input type="password" placeholder="Enter Password" name="password" id='txtPassword' required>

        <button type="button" id='btnConnect'>Connect</button>
        <button type="button" id='btnDisconnect'>Disconnect</button>
    </div>
    
    <div id="cpDivFeedback">
        Feedback div
    <div>

<div>
     
</body>
</html>
